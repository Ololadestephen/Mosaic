name: TestSprite PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to test (defaults to the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testsprite-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  testsprite:
    name: TestSprite PR preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PREVIEW_ORIGIN: https://mosaic-git-codex-hosted-previe-7f5fea-ololade-stephens-projects.vercel.app
      TESTSPRITE_PROJECT_ID: 680e00a5-896c-4d71-915e-c630602fdb8b
      TESTSPRITE_AUTH_ID: c25b68c7-d243-4349-a923-136abe12f44a
      TESTSPRITE_MANUAL_ID: dee97bb1-6af8-4fa9-9860-a17c5e8c2685
      TESTSPRITE_GUARD_ID: f3839677-1ace-4fec-b0b5-a77f2a4f952c
      TESTSPRITE_FIXTURE_ID: cbc840c3-9291-48ff-b8ae-865296076ff3
      FIXTURE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deterministic fixture dependencies
        run: npm ci --ignore-scripts

      - name: Capture exact head
        id: head
        run: echo "sha=${{ github.event.pull_request.head.sha || inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Wait for exact preview
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          endpoint="${PREVIEW_ORIGIN}/api/health?x-vercel-protection-bypass=${BYPASS}"
          for attempt in $(seq 1 60); do
            commit="$(curl -fsS "$endpoint" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            if [ "$commit" = "$SHA" ]; then
              echo "Preview reached $SHA"
              exit 0
            fi
            echo "Waiting for preview ($attempt/60): ${commit:-unavailable}"
            sleep 10
          done
          echo "Preview did not reach $SHA" >&2
          exit 1

      - name: Seed isolated preview fixture
        env:
          DATABASE_URL: ${{ secrets.TESTSPRITE_PREVIEW_DATABASE_URL }}
          FIXTURE_OWNER_EMAIL: ${{ secrets.TESTSPRITE_FIXTURE_OWNER_EMAIL }}
          SHA: ${{ steps.head.outputs.sha }}
        run: npx --no-install tsx scripts/testsprite/testsprite-fixture.ts

      - name: Prepare TestSprite CLI
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.testsprite"
          chmod 700 "$HOME/.testsprite"
          printf '[default]\napi_key = %s\napi_url = https://api.testsprite.com\n' "$TESTSPRITE_API_KEY" > "$HOME/.testsprite/credentials"
          chmod 600 "$HOME/.testsprite/credentials"

      - name: Verify reviewed scripts before running
        run: |
          set -euo pipefail
          for id in "$TESTSPRITE_AUTH_ID" "$TESTSPRITE_MANUAL_ID" "$TESTSPRITE_GUARD_ID" "$TESTSPRITE_FIXTURE_ID"; do
            npx -y @testsprite/testsprite-cli@0.2.0 --output json test code get "$id" > "code-before-${id}.json"
          done
          python3 scripts/testsprite/strict-pins.py before scripts/testsprite/strict-pins.json .

      - name: Run required TestSprite cases
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -uo pipefail
          target="${PREVIEW_ORIGIN}/?x-vercel-protection-bypass=${BYPASS}&x-vercel-set-bypass-cookie=true&expected_sha=${SHA}"
          fixture_target="${target}&fixture_run=${FIXTURE_RUN}"
          status=0
          : > testsprite-summary.txt
          for id in "$TESTSPRITE_AUTH_ID" "$TESTSPRITE_MANUAL_ID" "$TESTSPRITE_GUARD_ID" "$TESTSPRITE_FIXTURE_ID"; do
            case_target="$target"
            if [ "$id" = "$TESTSPRITE_FIXTURE_ID" ]; then
              case_target="$fixture_target"
            fi
            echo "::group::TestSprite $id"
            if npx -y @testsprite/testsprite-cli@0.2.0 --output json test run "$id" --wait --timeout 900 --target-url "$case_target" --idempotency-key "mosaic-pr-${SHA}-${GITHUB_RUN_ID}-${id}" > "testsprite-run-${id}.json"; then
              echo "$id passed" | tee -a testsprite-summary.txt
            else
              code=$?
              echo "$id failed (exit $code)" | tee -a testsprite-summary.txt
              status=1
            fi
            echo "::endgroup::"
            npx -y @testsprite/testsprite-cli@0.2.0 --output json test code get "$id" > "code-after-${id}.json" || status=1
          done
          python3 scripts/testsprite/strict-pins.py after scripts/testsprite/strict-pins.json . "$SHA" "$PREVIEW_ORIGIN" || status=1
          exit $status

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-pr-${{ steps.head.outputs.sha }}
          path: |
            testsprite-summary.txt
            testsprite-summary.json
          if-no-files-found: ignore
