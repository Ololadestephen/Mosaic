name: TestSprite native App verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Trusted Mosaic PR number (only PR 1 is provisioned)
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: mosaic-native-app-fixture
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare native App fixture
    if: vars.MOSAIC_NATIVE_APP_APPROVED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.number == 1 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/hosted-preview-security-tests'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.trust.outputs.sha }}
      fixture_run: ${{ steps.fixture.outputs.run }}
      change_set: ${{ steps.fixture.outputs.change_set }}
      prepared_at: ${{ steps.plans.outputs.prepared_at }}
    env:
      PREVIEW_ORIGIN: https://mosaic-git-codex-hosted-previe-7f5fea-ololade-stephens-projects.vercel.app
      FIXTURE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Authorize exact trusted PR head
        id: trust
        uses: actions/github-script@v7
        with:
          script: |
            if (context.repo.owner !== 'Ololadestephen' || context.repo.repo !== 'Mosaic') throw new Error('Wrong repository');
            const number = context.eventName === 'workflow_dispatch' ? context.payload.inputs?.pr : String(context.payload.pull_request?.number);
            if (number !== '1') throw new Error('Only PR 1 has isolated preview resources');
            if (context.eventName === 'workflow_dispatch' && !['refs/heads/main', 'refs/heads/codex/hosted-preview-security-tests'].includes(context.ref)) throw new Error('Untrusted dispatch ref');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 1 });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== 'Ololadestephen/Mosaic' || pr.head.repo?.full_name !== 'Ololadestephen/Mosaic' || pr.head.ref !== 'codex/hosted-preview-security-tests' || !/^[a-f0-9]{40}$/.test(pr.head.sha)) throw new Error('Untrusted PR');
            if (context.eventName !== 'workflow_dispatch' && context.payload.pull_request?.head.sha !== pr.head.sha) throw new Error('Stale PR event');
            core.setOutput('sha', pr.head.sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.trust.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Wait for exact preview
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SHA: ${{ steps.trust.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            commit="$(curl -fsS -H "x-vercel-protection-bypass: ${BYPASS}" "${PREVIEW_ORIGIN}/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)"
            if [ "$commit" = "$SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "Preview did not reach the trusted head" >&2
          exit 1
      - name: Seed unconsumed isolated fixture
        id: fixture
        env:
          DATABASE_URL: ${{ secrets.TESTSPRITE_PREVIEW_DATABASE_URL }}
          FIXTURE_OWNER_EMAIL: ${{ vars.MOSAIC_NATIVE_APP_OWNER_EMAIL }}
          SHA: ${{ steps.trust.outputs.sha }}
        run: |
          set -euo pipefail
          umask 077
          node --import tsx scripts/testsprite/testsprite-app-fixture.ts > "$RUNNER_TEMP/app-fixture.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUNNER_TEMP'] + '/app-fixture.json'))
          assert data['sha'] == os.environ['SHA'] and data['fixtureRun'] == os.environ['FIXTURE_RUN']
          assert data['seeded'] is True and data['liveAi'] is False and data['database'] == 'mosaic_pr1_test'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('change_set=' + data['changeSetId'] + '\nrun=' + data['fixtureRun'] + '\n')
          PY
      - name: Prepare exact native plans (does not execute tests)
        id: plans
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          SHA: ${{ steps.trust.outputs.sha }}
          CHANGE_SET: ${{ steps.fixture.outputs.change_set }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.testsprite"
          chmod 700 "$HOME/.testsprite"
          printf '[default]\napi_key = %s\napi_url = https://api.testsprite.com\n' "$TESTSPRITE_API_KEY" > "$HOME/.testsprite/credentials"
          chmod 600 "$HOME/.testsprite/credentials"
          plans="$RUNNER_TEMP/mosaic-app-plans"
          node --import tsx scripts/testsprite/testsprite-app-plans.ts --sha "$SHA" --run "$FIXTURE_RUN" --change-set "$CHANGE_SET" --out "$plans"
          prepared_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for entry in 'session:e6bb3299-471c-4afe-b939-6138b393cc59:plan-session.json' 'taskSource:bb8729d9-edcb-4705-afaa-b34e506b686f:plan-task-source.json' 'review:4faaa0ab-6d97-443a-bb71-9df7ba857577:plan-review-put.json'; do
            IFS=: read -r kind id file <<< "$entry"
            npx -y @testsprite/testsprite-cli@0.2.0 --output json test plan put "$id" --steps "$plans/$file" --idempotency-key "mosaic-native-${SHA}-${FIXTURE_RUN}-${kind}" > "$RUNNER_TEMP/plan-${kind}-receipt.json"
          done
          export PLAN_DIR="$plans"
          node --import tsx --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { APP_TEST_IDS, verifyPlanReceipt, verifyNativeMetadata } from './scripts/testsprite/testsprite-app-evidence.ts';
          const files = { session: 'plan-session.json', taskSource: 'plan-task-source.json', review: 'plan-review-put.json' };
          const manifest = JSON.parse(readFileSync(`${process.env.PLAN_DIR}/manifest.json`, 'utf8'));
          const cli = args => JSON.parse(execFileSync('npx', ['-y', '@testsprite/testsprite-cli@0.2.0', '--output', 'json', ...args], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
          for (const [kind, id] of Object.entries(APP_TEST_IDS)) {
            const steps = JSON.parse(readFileSync(`${process.env.PLAN_DIR}/${files[kind]}`, 'utf8')).planSteps;
            const receipt = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/plan-${kind}-receipt.json`, 'utf8'));
            verifyPlanReceipt(receipt, steps, id);
            cli(['test', 'update', id, '--name', manifest.names[kind], '--description', manifest.descriptions[kind], '--idempotency-key', `mosaic-native-goal-${process.env.SHA}-${process.env.FIXTURE_RUN}-${kind}`]);
            verifyNativeMetadata(cli(['test', 'get', id]), id, manifest.names[kind], manifest.descriptions[kind], steps);
          }
          console.log('Exact saved plans and complete pass criteria verified; no tests executed.');
          JS
          echo "prepared_at=$prepared_at" >> "$GITHUB_OUTPUT"

  readiness:
    name: Publish trusted native fixture readiness
    needs: prepare
    if: needs.prepare.result == 'success' && vars.MOSAIC_NATIVE_APP_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Publish success-only signal after rechecking the trusted head
        uses: actions/github-script@v7
        with:
          script: |
            if (context.repo.owner !== 'Ololadestephen' || context.repo.repo !== 'Mosaic') throw new Error('Wrong repository');
            const sha = process.env.EXPECTED_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('Missing prepared commit');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 1 });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.base.repo.full_name !== 'Ololadestephen/Mosaic' || pr.head.repo?.full_name !== 'Ololadestephen/Mosaic' || pr.head.ref !== 'codex/hosted-preview-security-tests' || pr.head.sha !== sha) throw new Error('Prepared PR head is no longer trusted/current');
            if (context.eventName === 'pull_request' && (context.payload.pull_request?.number !== 1 || context.payload.pull_request?.head.sha !== sha)) throw new Error('Stale PR event');
            if (context.eventName === 'workflow_dispatch' && (context.payload.inputs?.pr !== '1' || !['refs/heads/main', 'refs/heads/codex/hosted-preview-security-tests'].includes(context.ref))) throw new Error('Untrusted dispatch');
            if (!['pull_request', 'workflow_dispatch'].includes(context.eventName)) throw new Error('Unsupported event');
            await github.rest.repos.createCommitStatus({ ...context.repo, sha, state: 'success', context: 'Mosaic native fixture ready', description: 'Trusted PR 1 fixture and exact native plans prepared', target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

  verify:
    name: Verify native App evidence
    needs: [prepare, readiness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      PREPARED_AT: ${{ needs.prepare.outputs.prepared_at }}
      FIXTURE_RUN: ${{ needs.prepare.outputs.fixture_run }}
      CHANGE_SET: ${{ needs.prepare.outputs.change_set }}
      APP_EVIDENCE_DIR: ${{ github.workspace }}/.local/native-app-evidence
      PREVIEW_ORIGIN: https://mosaic-git-codex-hosted-previe-7f5fea-ololade-stephens-projects.vercel.app
    steps:
      - name: Require successful authorized preparation
        env:
          PREPARATION_RESULT: ${{ needs.prepare.result }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          NATIVE_EVENT_ARMED: ${{ vars.MOSAIC_NATIVE_APP_EVENT_ARMED }}
        run: |
          if [ "$NATIVE_EVENT_ARMED" != true ] || [ "$PREPARATION_RESULT" != success ] || [ "$READINESS_RESULT" != success ]; then
            echo "Native verification was not authorized/prepared. No passing result is claimed." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Recreate assertion expectations
        run: node --import tsx scripts/testsprite/testsprite-app-plans.ts --sha "$SHA" --run "$FIXTURE_RUN" --change-set "$CHANGE_SET" --out "$APP_EVIDENCE_DIR"
      - name: Wait for separately approved native App event (never sends or retries one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --import tsx scripts/testsprite/wait-testsprite-app.ts
      - name: Verify executed native tests and exported assertions
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.testsprite"
          chmod 700 "$HOME/.testsprite"
          printf '[default]\napi_key = %s\napi_url = https://api.testsprite.com\n' "$TESTSPRITE_API_KEY" > "$HOME/.testsprite/credentials"
          chmod 600 "$HOME/.testsprite/credentials"
          npm install --prefix "$RUNNER_TEMP/testsprite-reader" --ignore-scripts --no-audit --no-fund @testsprite/testsprite-cli@0.2.0
          TESTSPRITE_CLI="$RUNNER_TEMP/testsprite-reader/node_modules/.bin/testsprite" node --import tsx scripts/testsprite/testsprite-app-evidence.ts
      - name: Verify durable fixture outcomes without writing
        env:
          DATABASE_URL: ${{ secrets.TESTSPRITE_PREVIEW_DATABASE_URL }}
        run: node --import tsx scripts/testsprite/verify-testsprite-app-fixture.ts
      - name: Verify preview and current PR still match
        env:
          GH_TOKEN: ${{ github.token }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          current="$(gh api repos/Ololadestephen/Mosaic/pulls/1 --jq .head.sha)"
          commit="$(curl -fsS -H "x-vercel-protection-bypass: ${BYPASS}" "${PREVIEW_ORIGIN}/api/health" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          test "$current" = "$SHA" && test "$commit" = "$SHA"
      - name: Upload sanitized verification summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-app-verification-${{ needs.prepare.outputs.sha }}
          path: |
            ${{ env.APP_EVIDENCE_DIR }}/summary.json
            ${{ env.APP_EVIDENCE_DIR }}/export-audit.json
            ${{ env.APP_EVIDENCE_DIR }}/database.json
          if-no-files-found: ignore
