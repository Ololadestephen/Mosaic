name: Mosaic local verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mosaic-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.lane }} (no live AI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [static-and-unit, postgres-invariants, browser-fixtures]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mosaic_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: mosaic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mosaic_ci -d mosaic_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: "true"
      AI_ENABLED: "false"
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL: postgresql://mosaic_ci:synthetic-ci-only@localhost:5432/mosaic_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - if: matrix.lane == 'static-and-unit'
        run: |
          npm run check:publication
          npm run format:check
          npm run lint
          npm run test:unit
          npm run build
          npm run typecheck
          npm run check:package
      - if: matrix.lane == 'postgres-invariants'
        run: npm run test:integration
      - if: matrix.lane == 'browser-fixtures'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      # Reports remain on the runner; no internal evidence is uploaded.
      # Fork PRs run only with disposable PostgreSQL and no repository secrets.
